name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: 造 demo 文档与假字库
        working-directory: examples/demo
        run: |
          python make_demo_docx.py
          python make_demo_glyphs.py
      - name: 填充
        working-directory: examples/demo
        run: inkcell fill --project . --docx src_docx/demo.docx
      - name: 自检（版面不动 / 图不变形 / 条目都填了）
        working-directory: examples/demo
        run: |
          inkcell verify --src src_docx/demo.docx --out out/report.docx \
            --fill-data data/fill_data.json --slots-dir work/slots
